
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = false
    }
}

gesture = 3, vertical, workspace
gesture = 3,  left, dispatcher, layoutmsg, move +col
gesture = 3,  right, dispatcher, layoutmsg, move -col
